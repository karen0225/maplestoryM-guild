<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王團排程表</title>
<style>
  :root{
    --bg: #12141c;
    --bg-elev: #1a1d28;
    --bg-elev-2: #20242f;
    --border: #2b2f3d;
    --accent: #c9a35c;
    --accent-soft: #e7cf9e;
    --accent-dim: #6b5a35;
    --text: #ece7da;
    --text-dim: #9aa0ad;
    --text-faint: #6b7280;
    --danger: #d9756f;
    --danger-bg: #3a2426;
    --success: #6fae7f;
    --warn: #d6a14a;
    --radius: 10px;
    --mono: "SF Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;}
  #app{max-width:1200px;margin:0 auto;padding:0 16px 60px;}

  header.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg, var(--bg) 70%, transparent);padding:18px 0 10px;margin-bottom:6px;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:space-between;}
  .brand h1{font-size:21px;margin:0;letter-spacing:1px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .brand h1::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .brand .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .version-tag{color:var(--text-faint);font-size:11.5px;font-family:var(--mono);margin-top:4px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .save-indicator{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);white-space:nowrap;}

  button{font-family:var(--sans);cursor:pointer;border:1px solid var(--border);background:var(--bg-elev);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13.5px;transition:border-color .15s, background .15s;}
  button:hover{border-color:var(--accent-dim);}
  button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600;}
  button.primary:hover{background:var(--accent-soft);}
  button.ghost{background:transparent;}
  button.danger{color:var(--danger);}
  button.danger:hover{border-color:var(--danger);background:var(--danger-bg);}
  button.sm{padding:5px 10px;font-size:12.5px;}
  button.xs{padding:2px 7px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input[type=file]{display:none;}

  nav.tabs{display:flex;gap:4px;margin:14px 0 18px;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav.tabs button{background:transparent;border:none;border-radius:0;padding:10px 14px;color:var(--text-dim);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;}
  nav.tabs button.active{color:var(--accent-soft);border-bottom-color:var(--accent);font-weight:600;}
  nav.tabs button:hover{color:var(--text);}

  .panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .panel-title{font-size:14px;color:var(--accent-soft);font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}

  .version-history{margin:28px 0 20px;padding-top:16px;border-top:1px solid var(--border);}
  .version-history h2{font-size:13px;color:var(--accent-soft);font-weight:600;margin:0 0 10px;}
  .version-history > ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .version-history .vh-head{display:flex;align-items:baseline;gap:8px;}
  .version-history .vh-version{font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:600;}
  .version-history .vh-date{font-size:11.5px;color:var(--text-faint);}
  .version-history .vh-notes{list-style:disc;margin:4px 0 0 18px;padding:0;color:var(--text-dim);font-size:12.5px;line-height:1.6;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input[type=text], .toolbar input[type=search]{background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13.5px;flex:1;min-width:140px;}
  .spacer{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;color:var(--text-dim);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--bg-elev-2);}
  tbody tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}

  .empty{text-align:center;padding:36px 16px;color:var(--text-faint);font-size:13.5px;}

  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.conflict{background:#3a2f1c;color:var(--warn);border:1px solid var(--accent-dim);}
  .badge.guest{background:#22324a;color:#8fb6e0;border:1px solid #345277;}

  .chip{display:inline-flex;align-items:center;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px 3px 2px 0;color:var(--text-dim);}
  .chip.conflict{border-color:var(--warn);color:var(--warn);}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,9,13,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;}
  .modal-box{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 22px;}
  .modal-box.wide{max-width:680px;}
  .modal-box h3{margin:0 0 16px;font-size:16px;color:var(--accent-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field select, .field textarea{
    width:100%;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;font-family:var(--sans);
  }
  .field textarea{resize:vertical;min-height:54px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

  .dnd-columns{display:flex;gap:16px;flex-wrap:wrap;}
  .dnd-col{flex:1;min-width:230px;}
  .dnd-col h4{font-size:12.5px;color:var(--text-dim);margin:0 0 8px;font-weight:600;}
  .pool-search{margin-bottom:8px;}
  .pool-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;}
  .pool-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:4px;background:var(--bg-elev-2);cursor:grab;font-size:13.5px;border:1px solid transparent;}
  .pool-chip:hover{border-color:var(--accent-dim);}
  .pool-chip:active{cursor:grabbing;}
  .pool-chip .name{flex:1;}
  .pool-chip .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
  .conflict-tag{font-size:10.5px;color:var(--warn);white-space:nowrap;}
  .pool-empty{color:var(--text-faint);font-size:12px;text-align:center;padding:18px 8px;}

  .lineup-zone{min-height:300px;max-height:300px;overflow-y:auto;border:2px dashed var(--border);border-radius:8px;padding:8px;transition:border-color .15s, background .15s;}
  .lineup-zone.drag-over{border-color:var(--accent);background:rgba(201,163,92,.08);}
  .lineup-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:4px;background:var(--bg-elev-2);border:1px solid var(--border);font-size:13.5px;}
  .lineup-item .left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
  .lineup-item .remove-btn{background:none;border:none;color:var(--text-faint);font-size:16px;line-height:1;padding:0 4px;cursor:pointer;flex-shrink:0;}
  .lineup-item .remove-btn:hover{color:var(--danger);}
  .lineup-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:30px 8px;}
  .guest-add-row{display:flex;gap:6px;margin-top:8px;}
  .guest-add-row input{flex:1;}
  .count-indicator{font-family:var(--mono);font-size:12.5px;margin-top:8px;}
  .count-indicator.ok{color:var(--success);}
  .count-indicator.warn{color:var(--warn);}

  /* calendar */
  .cal-scroll{overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;}
  .calendar-grid{display:flex;gap:10px;align-items:flex-start;}
  .cal-col{display:flex;flex-direction:column;flex:1 1 160px;min-width:160px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:10px;min-height:140px;}
  .cal-col.is-collapsed{flex:0 0 130px;min-width:130px;padding:10px 6px;}
  .cal-col-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent-soft);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border);}
  .cal-col-head-label{flex:1;text-align:center;}
  .cal-expand-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;width:22px;height:22px;padding:0;font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .cal-expand-btn:hover{border-color:var(--accent-dim);color:var(--accent-soft);}
  .cal-expand-btn.active{border-color:var(--accent);color:var(--accent-soft);background:rgba(201,163,92,.12);}
  .cal-col-body{flex:1;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow-y:auto;overflow-x:hidden;padding-right:2px;}
  .cal-empty{color:var(--text-faint);font-size:11.5px;text-align:center;padding:16px 4px;}
  .cal-add-btn{margin-top:8px;width:100%;}

  /* calendar：非展開日縮小時的精簡清單 */
  .cal-mini-item{display:flex;flex-direction:column;gap:2px;padding:7px 5px;border-bottom:1px dashed var(--border);border-radius:6px;cursor:pointer;}
  .cal-mini-item:last-child{border-bottom:none;}
  .cal-mini-item:hover{background:var(--bg-elev-2);}
  .cal-mini-time{font-family:var(--mono);color:var(--accent-soft);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-mini-title{color:var(--text-dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-empty-mini{color:var(--text-faint);font-size:11px;text-align:center;padding:14px 2px;}

  /* calendar：單日展開後的橫向時間軸（時間水平排列，同一時間多團會往下並排） */
  .cal-expanded-panel .panel-title{margin-bottom:12px;}
  .cal-hz-wrap{overflow:auto;max-height:600px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev-2);}
  .cal-hz-inner{position:relative;}
  .cal-hz-ruler{position:sticky;top:0;height:28px;background:var(--bg-elev-2);border-bottom:1px solid var(--border);z-index:2;}
  .cal-hz-tick{position:absolute;top:0;height:100%;border-left:1px solid var(--border);padding-left:5px;font-size:10.5px;color:var(--text-faint);font-family:var(--mono);display:flex;align-items:center;white-space:nowrap;}
  .cal-hz-lanes{position:relative;}
  .cal-hz-gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--border);opacity:.45;}
  .cal-hz-card{position:absolute;padding:5px;box-sizing:border-box;min-width:240px;}
  .cal-hz-card .cal-raid-card{height:100%;overflow-y:auto;box-sizing:border-box;}
  .cal-hz-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:50px 16px;}

  /* calendar：展開時，其他天縮到下方的一排 */
  .cal-other-days{overflow-x:auto;margin-top:14px;padding-bottom:4px;}
  .cal-other-days-label{font-size:11.5px;color:var(--text-faint);margin:0 0 8px;}
  .cal-other-days-track{display:flex;gap:10px;}

  .cal-raid-card{border:1px solid var(--border);border-radius:8px;padding:8px 9px;background:var(--bg-elev-2);font-size:12.5px;transition:border-color .15s, background .15s;}
  /* 時間軸展開檢視中，依排序輪流套用的低彩度色調，方便區分相鄰的王團（避免使用過亮的顏色） */
  .cal-raid-card.tone-0{background:#232c3d;border-color:#33465e;}
  .cal-raid-card.tone-1{background:#243425;border-color:#354d38;}
  .cal-raid-card.tone-2{background:#332738;border-color:#4a3a52;}
  .cal-raid-card.tone-3{background:#213333;border-color:#2f4c4c;}
  .cal-raid-card.tone-4{background:#332a21;border-color:#4d3e2c;}
  .cal-raid-card.tone-5{background:#2a2735;border-color:#3c374e;}
  .cal-raid-card.has-conflict{border-color:var(--accent-dim);}
  .cal-raid-card.drag-over{border-color:var(--accent);background:rgba(201,163,92,.1);}
  .cal-raid-head{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;}
  .cal-raid-title{font-weight:600;font-size:13px;}
  .cal-raid-meta{color:var(--text-dim);font-size:11px;margin-top:1px;}
  .cal-conflict-note{color:var(--warn);font-size:11px;margin-top:5px;}
  .cal-lineup{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;min-height:24px;}
  .cal-lineup-empty{color:var(--text-faint);font-size:11px;padding:5px 0;}
  .cal-chip{display:inline-flex;align-items:center;gap:3px;background:var(--bg-elev);border:1px solid var(--border);border-radius:99px;padding:2px 4px 2px 9px;font-size:11.5px;cursor:grab;color:var(--text);}
  .cal-chip.conflict{border-color:var(--warn);color:var(--warn);}
  .cal-chip:active{cursor:grabbing;}
  .cal-chip .remove-btn{background:none;border:none;color:var(--text-faint);font-size:13px;line-height:1;padding:0 4px;cursor:pointer;}
  .cal-chip .remove-btn:hover{color:var(--danger);}
  .cal-pool-wrap{margin-bottom:14px;}
  .cal-pool-list{max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
  .cal-pool-chip{display:flex;align-items:center;gap:6px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:grab;}
  .cal-pool-chip:hover{border-color:var(--accent-dim);}
  .cal-pool-chip:active{cursor:grabbing;}
  .cal-pool-chip .n{font-size:10.5px;color:var(--text-faint);}

  @media (max-width:640px){
    table thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--border);padding:8px 0;}
    tbody td{border-bottom:none;padding:3px 2px;display:flex;justify-content:space-between;gap:10px;}
    tbody td::before{content:attr(data-label);color:var(--text-dim);font-size:11.5px;}
    .row-actions{justify-content:flex-start;margin-top:6px;}
    .field-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- state ----------
let state = { members: [], raids: [] };
// member: { id, gameId, name }
// raid:   { id, dateMode:'date'|'weekday', date:'YYYY-MM-DD' (當 dateMode='date'), weekday:null|0-6 (當 dateMode='weekday'),
//           startTime:'HH:mm', endTime:'HH:mm', title, note, slots:[{type:'member',refId} | {type:'guest',id,name}] }

let ui = {
  tab: 'raids',
  memberSearch: '',
  calPoolSearch: '',
  modal: null,            // 'member' | 'raid' | 'confirm'
  editingMemberId: null,
  editingRaidId: null,
  raidForm: null,
  poolSearch: '',
  confirm: null,
  expandedDay: null,      // 目前水平展開檢視中的星期（0-6），null 表示都沒展開
};

// ---------- version history ----------
// 每次有實質更新時，在陣列最前面新增一筆（最新的排最前面）
const VERSION_HISTORY = [
  { version: '1.4.0', date: '2026-07-27', notes: [
    '編輯王團紀錄視窗與展開王團卡片新增「複製名單」按鈕，可一鍵複製王團名稱、星期、時間與出場名單',
  ] },
  { version: '1.3.0', date: '2026-07-25', notes: [
    '簡潔UI顯示，展開後每個王團以不同顏色區分',
  ] },
  { version: '1.2.0', date: '2026-07-25', notes: [
    '新增「展開」按鈕：展開某一天後，以時間軸的方式顯示'
  ] },
  { version: '1.1.0', date: '2026-07-25', notes: ['修復搜尋框在輸入中文（注音／拼音等輸入法）時被強制中斷，導致無法打字的問題'] },
  { version: '1.0.0', date: '2026-07-25', notes: ['初始版本：成員名單、王團紀錄、行事曆檢視、排班衝突偵測'] },
];
const CURRENT_VERSION = VERSION_HISTORY[0];

const STORAGE_KEY = 'guild-raid-schedule-v3';
const WEEKDAYS = ['日','一','二','三','四','五','六']; // index 0-6, matches Date#getDay()
const CAL_ORDER = [1,2,3,4,5,6,0]; // 週一 ~ 週日

// ---------- storage ----------
// 主要使用瀏覽器原生 localStorage（同裝置、同瀏覽器下次開啟這個檔案都讀得到）；
// 若剛好跑在有提供 window.storage 的環境（例如某些沙盒／artifact 執行環境），也會一併寫入，兩者互不影響。
async function loadData(){
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      try{ const r = await window.storage.get(STORAGE_KEY); if(r && r.value) raw = r.value; }catch(e){}
    }
    if(!raw) raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.members = Array.isArray(parsed.members) ? parsed.members : [];
      state.raids = Array.isArray(parsed.raids) ? parsed.raids : [];
      lastSaved = new Date();
    }
  }catch(e){ /* 尚無資料 */ }
  render();
}
let saveTimer = null, lastSaved = null;
async function persistNow(){
  const json = JSON.stringify(state);
  let ok = false;
  try{ localStorage.setItem(STORAGE_KEY, json); ok = true; }
  catch(e){ console.error('localStorage 儲存失敗', e); }
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(STORAGE_KEY, json, false); ok = true; }
    catch(e){ console.error('window.storage 儲存失敗', e); }
  }
  if(ok) lastSaved = new Date();
  renderSaveIndicator();
}
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 250);
}
// 每 30 秒定時自動儲存一次，當作保險（避免因為某些操作沒觸發 saveData 而漏存）
setInterval(persistNow, 30000);

// ---------- utils ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}（週${WEEKDAYS[d.getDay()]}）`;
}
function fmtDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function fmtTimeRange(s,e){ if(!s) return '—'; return e ? `${s}–${e}` : s; }
function toMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function addMinutes(t, mins){ const total=(toMinutes(t)+mins+1440)%1440; const h=Math.floor(total/60), m=total%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStamp(){ return todayStr().replace(/-/g,''); }
function weekdayOf(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); return isNaN(d.getTime())?null:d.getDay(); }
function weekdayLabel(i){ return (i==null || i==='') ? '未固定' : '週'+WEEKDAYS[Number(i)]; }
function raidWeekday(r){ return r.dateMode==='weekday' ? (r.weekday==null||r.weekday===''?null:Number(r.weekday)) : weekdayOf(r.date); }
function fmtRaidDate(r){ return r.dateMode==='weekday' ? `每週${WEEKDAYS[Number(r.weekday)]}` : fmtDate(r.date); }
function memberById(id){ return state.members.find(x=>x.id===id); }
function memberLabel(id){ const m=memberById(id); if(!m) return '（已刪除的成員）'; return m.gameId + (m.name ? `（${m.name}）` : ''); }
function slotKey(s){ return s.type==='member' ? 'm:'+s.refId : 'g:'+s.id; }
function slotName(s){ return s.type==='member' ? memberLabel(s.refId) : s.name; }
function raidsForMember(memberId){
  return state.raids.filter(r=> r.slots.some(s=>s.type==='member' && s.refId===memberId))
    .slice()
    .sort((a,b)=>{
      const wa=raidWeekday(a), wb=raidWeekday(b);
      if(wa!==wb) return (wa==null?99:wa) - (wb==null?99:wb);
      return (toMinutes(a.startTime)||0) - (toMinutes(b.startTime)||0);
    });
}

// ---------- conflict logic ----------
// 兩個王團紀錄時間重疊：同一天（指定日期）或同一個星期（每週固定）且時段重疊
function rangesOverlap(aS,aE,bS,bE){ return aS < bE && bS < aE; }
function raidRange(r){ const s=toMinutes(r.startTime); const e=r.endTime?toMinutes(r.endTime):s+60; return [s,e]; }
function sameDayBasis(a,b){
  if(a.dateMode!=='weekday' && b.dateMode!=='weekday') return !!(a.date && b.date && a.date===b.date);
  const wa = raidWeekday(a), wb = raidWeekday(b);
  return wa!=null && wb!=null && wa===wb;
}
function raidsOverlap(a,b){
  if(a.id===b.id) return false;
  if(!sameDayBasis(a,b)) return false;
  if(!a.startTime || !b.startTime) return false;
  const [aS,aE]=raidRange(a), [bS,bE]=raidRange(b);
  return rangesOverlap(aS,aE,bS,bE);
}
function memberIdsInRaid(r){ return r.slots.filter(s=>s.type==='member').map(s=>s.refId); }
// 撞團判斷的「身分」依據：同一個名字視為同一個人（可能用不同遊戲ID的角色出場），
// 沒填名字的成員則各自獨立（沒有可比對的依據，維持只跟自己的角色比對）。
function memberIdentityKey(memberId){
  const m = memberById(memberId);
  const name = m && m.name ? m.name.trim() : '';
  return name ? 'name:'+name.toLowerCase() : 'id:'+memberId;
}
function computeConflictPairs(){
  const pairs = [];
  for(let i=0;i<state.raids.length;i++){
    for(let j=i+1;j<state.raids.length;j++){
      const a=state.raids[i], b=state.raids[j];
      if(!raidsOverlap(a,b)) continue;
      const aIds=memberIdsInRaid(a), bIds=memberIdsInRaid(b);
      const aKeys = new Set(aIds.map(memberIdentityKey));
      const bKeys = new Set(bIds.map(memberIdentityKey));
      const overlapIdsA = aIds.filter(id=> bKeys.has(memberIdentityKey(id)));
      const overlapIdsB = bIds.filter(id=> aKeys.has(memberIdentityKey(id)));
      if(overlapIdsA.length || overlapIdsB.length){
        pairs.push({ a, b, overlapIdsA, overlapIdsB });
      }
    }
  }
  return pairs;
}
function conflictsForRaid(raidId){ return computeConflictPairs().filter(p=>p.a.id===raidId || p.b.id===raidId); }
// 某成員（角色）自己排入的王團之間，哪幾場彼此時段重疊：Map<raidId, 與其重疊的其他王團[]>
// 同名的其他角色被排進另一場重疊的王團，也算數（視為同一個人）。
function memberConflictInfo(memberId){
  const map = new Map();
  computeConflictPairs().forEach(p=>{
    if(p.overlapIdsA.includes(memberId)){
      if(!map.has(p.a.id)) map.set(p.a.id, []);
      map.get(p.a.id).push(p.b);
    }
    if(p.overlapIdsB.includes(memberId)){
      if(!map.has(p.b.id)) map.set(p.b.id, []);
      map.get(p.b.id).push(p.a);
    }
  });
  return map;
}
// 草稿期間（編輯視窗內）：某成員若加入這個正在編輯的王團，是否會跟「其他既有王團」時間重疊
// （同名的其他角色若已排在重疊時段的王團裡，也視為撞團）
function memberConflictWith(memberId, draft, excludeRaidId){
  if(!draft.startTime) return null;
  const fake = { id:'__draft__', dateMode:draft.dateMode, date:draft.date, weekday:draft.weekday, startTime:draft.startTime, endTime:draft.endTime };
  if(raidWeekday(fake)==null) return null;
  const key = memberIdentityKey(memberId);
  for(const r of state.raids){
    if(r.id===excludeRaidId) continue;
    if(!raidsOverlap(fake, r)) continue;
    if(memberIdsInRaid(r).some(id=> memberIdentityKey(id)===key)) return r;
  }
  return null;
}

const HZ_TONE_COUNT = 6;
function renderCalRaidCard(r, toneIdx){
  const conflicts = conflictsForRaid(r.id);
  const conflictMap = {};
  conflicts.forEach(p=>{
    const isA = p.a.id===r.id;
    const other = isA ? p.b : p.a;
    const ids = isA ? p.overlapIdsA : p.overlapIdsB;
    ids.forEach(id=>{ conflictMap[id]=other; });
  });
  const hasConflict = conflicts.length>0;
  const dateNote = r.dateMode!=='weekday' ? fmtDate(r.date) : '';
  const toneClass = toneIdx==null ? '' : ` tone-${toneIdx % HZ_TONE_COUNT}`;
  const lineupHtml = r.slots.length===0
    ? `<div class="cal-lineup-empty">拖拉成員到這裡</div>`
    : r.slots.map(s=>{
        const conflictOther = s.type==='member' ? conflictMap[s.refId] : null;
        return `<span class="cal-chip ${conflictOther?'conflict':''}" draggable="true" data-action="cal-chip" data-raid-id="${r.id}" data-slot-key="${slotKey(s)}" title="${conflictOther?('⚠ 與「'+esc(conflictOther.title||'王團')+'」時段重疊'):''}">

          <button class="remove-btn" data-action="cal-remove-slot" data-raid-id="${r.id}" data-slot-key="${slotKey(s)}" title="移除">×</button>
        </span>`;
      }).join('');
  return `
  <div class="cal-raid-card${toneClass} ${hasConflict?'has-conflict':''}" data-action="cal-dropzone" data-raid-id="${r.id}">
    <div class="cal-raid-head">
      <div>
        <div class="cal-raid-title">${esc(r.title||'王團')}</div>
        <div class="cal-raid-meta">${fmtTimeRange(r.startTime,r.endTime)}${dateNote?(' · '+dateNote):''} · ${r.slots.length}/10</div>
      </div>
      <div class="row-actions">
        <button class="xs" data-action="copy-raid" data-id="${r.id}" title="複製王團名稱、時間與出場名單">📋</button>
        <button class="xs" data-action="edit-raid" data-id="${r.id}" title="編輯">✎</button>
        <button class="xs danger" data-action="delete-raid" data-id="${r.id}" title="刪除">×</button>
      </div>
    </div>
    ${hasConflict ? `<div class="cal-conflict-note">⚠ 與其他王團時段重疊</div>` : ''}
    <div class="cal-lineup">${lineupHtml}</div>
  </div>`;
}

// 排版單日內互相重疊（同一時間有多團）的王團到不同「軌道」，避免橫向時間軸上互相蓋住
const HZ_PX_PER_HOUR = 84;
const HZ_MIN_CARD_WIDTH = 240;
const HZ_LANE_HEIGHT = 196;
function layoutHzTimeline(raids){
  const minWidthMinutes = (HZ_MIN_CARD_WIDTH / HZ_PX_PER_HOUR) * 60;
  const gapMinutes = (14 / HZ_PX_PER_HOUR) * 60;
  const items = raids.map(r=>{ const [s,e]=raidRange(r); return { raid:r, start:s, end:e, lane:0 }; })
    .sort((a,b)=> a.start-b.start || a.end-b.end);
  const laneOccupiedUntil = [];
  items.forEach(it=>{
    const visualEnd = it.start + Math.max(it.end - it.start, minWidthMinutes) + gapMinutes;
    let lane = laneOccupiedUntil.findIndex(endT=> it.start >= endT);
    if(lane===-1){ lane = laneOccupiedUntil.length; laneOccupiedUntil.push(visualEnd); }
    else laneOccupiedUntil[lane] = visualEnd;
    it.lane = lane;
  });
  return { items, laneCount: Math.max(laneOccupiedUntil.length, 1) };
}
// 單日展開後的橫向時間軸：時間範圍依當天實際王團時間動態決定（例如只有 8~10 點的團，就只顯示 8~10 點這段），
// 同一時間如有多團會往下堆疊並排顯示，不呈現日期。
// 寬度用「百分比」定位、容器寬度用 CSS max(100%, 最小需要的像素寬) 決定：
// 時段範圍小的時候會直接撐滿面板 100% 寬（不會擠成一小塊），時段範圍大的時候才會出現橫向捲軸。
function renderHzTimeline(raids){
  if(raids.length===0) return `<div class="cal-hz-empty">尚無安排</div>`;
  const { items, laneCount } = layoutHzTimeline(raids);
  const minStart = Math.min(...items.map(it=>it.start));
  const maxEnd = Math.max(...items.map(it=>it.end));
  const startHour = Math.max(0, Math.floor(minStart/60));
  const endHour = Math.min(24, Math.max(startHour+1, Math.ceil(maxEnd/60)));
  const totalHours = endHour - startHour;
  const minPxNeeded = totalHours * HZ_PX_PER_HOUR + 50;
  const lanesH = laneCount * HZ_LANE_HEIGHT;
  const hourTicks = Array.from({length: totalHours+1}, (_,i)=> startHour+i);
  const offsetPct = h=> ((h-startHour)/totalHours) * 100;
  return `
  <div class="cal-hz-wrap">
    <div class="cal-hz-inner" style="width:max(100%, ${minPxNeeded}px);">
      <div class="cal-hz-ruler">
        ${hourTicks.map(h=>`<div class="cal-hz-tick" style="left:${offsetPct(h)}%;">${String(h).padStart(2,'0')}:00</div>`).join('')}
      </div>
      <div class="cal-hz-lanes" style="height:${lanesH}px;">
        ${hourTicks.map(h=>`<div class="cal-hz-gridline" style="left:${offsetPct(h)}%;"></div>`).join('')}
        ${items.map((it,idx)=>{
          // 寬度直接照實際時長換算百分比即可；最小可讀寬度交給 CSS min-width 處理，
          // 這樣時段範圍窄、被撐到 100% 寬時，卡片會跟著等比例變寬，而不是被百分比公式誤放大。
          // 每個王團依開始時間排序後的順序，輪流套用不同（偏暗、不刺眼）的色調，方便區分彼此。
          const leftPct = ((it.start/60 - startHour)/totalHours) * 100;
          const widthPct = ((it.end-it.start)/60/totalHours) * 100;
          const top = it.lane*HZ_LANE_HEIGHT;
          return `<div class="cal-hz-card" style="left:${leftPct}%;top:${top}px;width:${widthPct}%;height:${HZ_LANE_HEIGHT}px;">${renderCalRaidCard(it.raid, idx)}</div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderRaidModal(){
  const f = ui.raidForm;
  const q = ui.poolSearch.trim().toLowerCase();
  const inLineupMemberIds = new Set(f.slots.filter(s=>s.type==='member').map(s=>s.refId));
  let poolMembers = state.members.filter(m=> !inLineupMemberIds.has(m.id) && (!q || m.gameId.toLowerCase().includes(q) || (m.name||'').toLowerCase().includes(q)));
  const count = f.slots.length;

  const poolHtml = poolMembers.length===0
    ? `<div class="pool-empty">${state.members.length===0 ? '尚無公會成員，請先到「會員名單」新增。' : '沒有可加入的成員了。'}</div>`
    : poolMembers.map(m=>{
        const overlapConflict = memberConflictWith(m.id, f, ui.editingRaidId);
        return `<div class="pool-chip" draggable="true" data-action="pool-chip" data-id="${m.id}">
          <span class="name">${esc(memberLabel(m.id))}</span>
          <span class="tags">${overlapConflict ? `<span class="conflict-tag">⚠ 撞「${esc(overlapConflict.title||'王團')}」</span>` : ''}</span>
        </div>`;
      }).join('');

  const lineupHtml = f.slots.length===0
    ? `<div class="lineup-empty">尚未加入任何人員<br>從左側拖拉或點擊成員加入</div>`
    : f.slots.map(s=>{
        const overlapConflict = s.type==='member' ? memberConflictWith(s.refId, f, ui.editingRaidId) : null;
        return `<div class="lineup-item" data-key="${slotKey(s)}">
          <div class="left">
            <span>${esc(slotName(s))}</span>
            ${s.type==='guest' ? `<span class="badge guest">訪客</span>` : ''}
            ${overlapConflict ? `<span class="badge conflict">撞「${esc(overlapConflict.title||'王團')}」</span>` : ''}
          </div>
          <button class="remove-btn" data-action="remove-slot" data-key="${slotKey(s)}" title="移除">×</button>
        </div>`;
      }).join('');

  return `
  <div class="modal-overlay" data-action="overlay-close">
    <div class="modal-box wide" data-stop>
      <h3 style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>${ui.editingRaidId?'編輯王團紀錄':'新增王團紀錄'}</span>
        ${ui.editingRaidId ? `<button class="sm ghost" data-action="copy-raid" data-id="${ui.editingRaidId}" title="複製王團名稱、時間與出場名單">📋 複製名單</button>` : ''}
      </h3>

      <div class="field">
        <label>日期 *</label>
        <div style="display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);"><input type="radio" name="r-datemode" value="date" data-action="r-datemode" ${f.dateMode!=='weekday'?'checked':''}> 指定日期</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);"><input type="radio" name="r-datemode" value="weekday" data-action="r-datemode" ${f.dateMode==='weekday'?'checked':''}> 星期幾（每週固定）</label>
        </div>
        ${f.dateMode==='weekday'
          ? `<select id="r-weekday" data-action="r-weekday">
               <option value="" ${f.weekday==null||f.weekday===''?'selected':''}>請選擇星期</option>
               ${WEEKDAYS.map((w,i)=>`<option value="${i}" ${String(f.weekday)===String(i)?'selected':''}>週${w}</option>`).join('')}
             </select>`
          : `<input type="date" id="r-date" value="${esc(f.date)}" data-action="r-date">`
        }
        ${f.dateMode!=='weekday' && f.date ? `<div class="hint">此日期為 ${fmtDate(f.date)}</div>` : ''}
        ${f.dateMode==='weekday' ? `<div class="hint">這筆紀錄不綁定特定日期，每次出現相同星期都會視為衝突依據。</div>` : ''}
      </div>

      <div class="field-row">
        <div class="field"><label>開始時間 *</label><input type="time" id="r-start" value="${esc(f.startTime)}" data-action="r-start"></div>
        <div class="field"><label>結束時間</label><input type="time" id="r-end" value="${esc(f.endTime)}" data-action="r-end"></div>
      </div>
      <div class="field"><label>名稱／標題（選填）</label><input type="text" id="r-title" value="${esc(f.title)}" placeholder="王團"></div>

      <div class="field">
        <label>出場名單</label>
        <div class="dnd-columns">
          <div class="dnd-col">
            <h4>公會成員（拖拉或點擊加入 →）</h4>
            <input type="search" class="pool-search" placeholder="搜尋遊戲ID或名字…" value="${esc(ui.poolSearch)}" data-action="pool-search">
            <div class="pool-list" data-action="pool-list">${poolHtml}</div>
            <div class="guest-add-row">
              <input type="text" id="guest-name-input" placeholder="非公會人員姓名（僅本團）">
              <button class="sm" data-action="add-guest">＋ 加入</button>
            </div>
          </div>
          <div class="dnd-col">
            <h4>已排入名單</h4>
            <div class="lineup-zone" data-action="lineup-zone">${lineupHtml}</div>
            <div class="count-indicator ${count===10?'ok':'warn'}">目前人數：${count} / 10${count!==10?'（與建議人數不同）':''}</div>
          </div>
        </div>
      </div>

      <div class="field"><label>備註（選填）</label><textarea id="r-note" placeholder="例如：借調其他公會玩家、調整原因等">${esc(f.note)}</textarea></div>

      <div class="modal-actions">
        <button class="ghost" data-action="close-modal">取消</button>
        <button class="primary" data-action="save-raid">${ui.editingRaidId?'儲存變更':'新增紀錄'}</button>
      </div>
    </div>
  </div>`;
}

// ---------- events ----------
function bindGlobalEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(el=> el.addEventListener('click', ()=>{ ui.tab=el.dataset.tab; ui.modal=null; render(); }));

  app.querySelectorAll('[data-action]').forEach(el=>{
    const a = el.dataset.action;
    if(a==='export') el.addEventListener('click', exportJSON);
    if(a==='import-click') el.addEventListener('click', ()=> document.getElementById('import-file').click());
    if(a==='save-now') el.addEventListener('click', ()=>{ clearTimeout(saveTimer); persistNow(); });
    if(a==='add-sample-data') el.addEventListener('click', addSampleData);
    if(a==='clear-sample-data') el.addEventListener('click', confirmClearSampleData);

    if(a==='open-member-modal') el.addEventListener('click', ()=> openMemberModal(null));
    if(a==='edit-member') el.addEventListener('click', ()=> openMemberModal(el.dataset.id));
    if(a==='delete-member') el.addEventListener('click', ()=> confirmDeleteMember(el.dataset.id));
    if(a==='save-member') el.addEventListener('click', saveMemberFromModal);

    if(a==='toggle-expand-day') el.addEventListener('click', ()=> toggleExpandDay(Number(el.dataset.weekday)));

    if(a==='open-raid-modal') el.addEventListener('click', ()=> openRaidModal(null));
    if(a==='quick-add-raid') el.addEventListener('click', ()=> openRaidModal(null, Number(el.dataset.weekday)));
    if(a==='edit-raid') el.addEventListener('click', ()=> openRaidModal(el.dataset.id));
    if(a==='delete-raid') el.addEventListener('click', ()=> confirmDeleteRaid(el.dataset.id));
    if(a==='save-raid') el.addEventListener('click', saveRaidFromModal);
    if(a==='copy-raid') el.addEventListener('click', e=>{ e.stopPropagation(); copyRaidInfo(el.dataset.id, el); });

    if(a==='r-datemode') el.addEventListener('change', e=>{ ui.raidForm.dateMode=e.target.value; renderModalOnly(); });
    if(a==='r-weekday') el.addEventListener('change', e=>{ ui.raidForm.weekday = e.target.value===''? null : Number(e.target.value); renderModalOnly(); });
    if(a==='r-date') el.addEventListener('change', e=>{ ui.raidForm.date=e.target.value; renderModalOnly(); });
    if(a==='r-start') el.addEventListener('change', e=>{
      ui.raidForm.startTime=e.target.value;
      if(!ui.raidForm.endTime && e.target.value) ui.raidForm.endTime = addMinutes(e.target.value,60);
      renderModalOnly();
    });
    if(a==='r-end') el.addEventListener('change', e=>{ ui.raidForm.endTime=e.target.value; renderModalOnly(); });

    if(a==='pool-search') bindSearchInput(el, e=>{ ui.poolSearch=e.target.value; renderModalOnly('pool'); });
    if(a==='add-guest') el.addEventListener('click', addGuestFromModal);
    if(a==='remove-slot') el.addEventListener('click', ()=> removeSlot(el.dataset.key));

    if(a==='cal-pool-search') bindSearchInput(el, e=>{ ui.calPoolSearch=e.target.value; renderTabOnly('cal-pool-search'); });
    if(a==='cal-remove-slot') el.addEventListener('click', e=>{ e.stopPropagation(); removeSlotFromRaid(el.dataset.raidId, el.dataset.slotKey); });

    if(a==='close-modal') el.addEventListener('click', closeModal);
    if(a==='confirm-yes') el.addEventListener('click', ()=>{ const fn=ui.confirm.onConfirm; closeModal(); fn&&fn(); });
    if(a==='overlay-close') el.addEventListener('click', closeModal);
  });

  app.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', e=> e.stopPropagation()));

  // 編輯視窗內：成員池 → 出場名單
  app.querySelectorAll('[data-action="pool-chip"]').forEach(el=>{
    el.addEventListener('click', ()=> addMemberToLineup(el.dataset.id));
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/member-id', el.dataset.id); });
  });
  const zone = app.querySelector('[data-action="lineup-zone"]');
  if(zone){
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); zone.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/member-id');
      if(id) addMemberToLineup(id);
    });
  }

  // 行事曆：成員池 chip（拖拉來源）
  app.querySelectorAll('[data-action="cal-pool-chip"]').forEach(el=>{
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/member-id', el.dataset.id); });
  });
  // 行事曆：王團卡片內的成員 chip（可拖到別的王團卡片移動）
  app.querySelectorAll('[data-action="cal-chip"]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('application/x-slot-move', JSON.stringify({ fromRaidId: el.dataset.raidId, slotKey: el.dataset.slotKey }));
    });
  });
  // 行事曆：王團卡片本身（拖放目標）
  app.querySelectorAll('[data-action="cal-dropzone"]').forEach(el=>{
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.classList.remove('drag-over');
      const raidId = el.dataset.raidId;
      const moveData = e.dataTransfer.getData('application/x-slot-move');
      const memberId = e.dataTransfer.getData('text/member-id');
      if(moveData){
        try{ const parsed = JSON.parse(moveData); moveSlotBetweenRaids(parsed.fromRaidId, raidId, parsed.slotKey); }catch(err){}
      }else if(memberId){
        addMemberToExistingRaid(raidId, memberId);
      }
    });
  });

  const ms = document.getElementById('member-search');
  if(ms) bindSearchInput(ms, e=>{ ui.memberSearch=e.target.value; renderTabOnly('member-search'); });

  const fileInput = document.getElementById('import-file');
  if(fileInput) fileInput.addEventListener('change', handleImportFile);

  const guestInput = document.getElementById('guest-name-input');
  if(guestInput) guestInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addGuestFromModal(); } });
}

// 搜尋框重繪會替換整個 DOM 節點，若在輸入法組字（例如中文）過程中重繪，
// 會打斷組字狀態導致無法輸入中文；因此組字期間先不重繪，等組字結束再套用。
function bindSearchInput(el, apply){
  let composing = false;
  el.addEventListener('compositionstart', ()=>{ composing=true; });
  el.addEventListener('compositionend', e=>{ composing=false; apply(e); });
  el.addEventListener('input', e=>{ if(!composing) apply(e); });
}
function renderTabOnly(focus){
  document.getElementById('tab-content').innerHTML = renderTabContent();
  bindGlobalEvents();
  if(focus==='member-search'){
    const el = document.getElementById('member-search');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  if(focus==='cal-pool-search'){
    const el = document.querySelector('[data-action="cal-pool-search"]');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function renderModalOnly(focus){
  const overlay = document.querySelector('.modal-overlay');
  if(!overlay) return;
  overlay.outerHTML = renderModal();
  bindGlobalEvents();
  if(focus==='pool'){
    const el = document.querySelector('[data-action="pool-search"]');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

// ---------- member actions ----------
function openMemberModal(id){
  ui.modal='member'; ui.editingMemberId=id; render();
  setTimeout(()=>{ const el=document.getElementById('m-gameid'); el&&el.focus(); },0);
}
function saveMemberFromModal(){
  const gameId = document.getElementById('m-gameid').value.trim();
  const name = document.getElementById('m-name').value.trim();
  if(!gameId){ alert('請輸入遊戲ID'); return; }
  if(ui.editingMemberId){
    const m = memberById(ui.editingMemberId);
    m.gameId=gameId; m.name=name;
  }else{
    state.members.push({ id:uid(), gameId, name });
  }
  saveData(); closeModal();
}
function confirmDeleteMember(id){
  ui.modal='confirm';
  ui.confirm = {
    title:'刪除成員',
    message:`確定要刪除「${esc(memberLabel(id))}」嗎？此成員會同時從所有王團紀錄的出場名單中移除，此動作無法復原。`,
    confirmLabel:'刪除',
    onConfirm: ()=>{
      state.members = state.members.filter(x=>x.id!==id);
      state.raids.forEach(r=>{ r.slots = r.slots.filter(s=> !(s.type==='member' && s.refId===id)); });
      saveData(); render();
    }
  };
  render();
}

// ---------- raid actions ----------
function toggleExpandDay(wd){
  ui.expandedDay = (ui.expandedDay===wd) ? null : wd;
  renderTabOnly();
}
function openRaidModal(id, presetWeekday){
  ui.modal='raid'; ui.editingRaidId=id; ui.poolSearch='';
  if(id){
    const r = state.raids.find(x=>x.id===id);
    ui.raidForm = { dateMode:r.dateMode||'date', date:r.date||'', weekday:(r.weekday==null?null:r.weekday), startTime:r.startTime||'', endTime:r.endTime||'', title:r.title||'', note:r.note||'', slots: r.slots.map(s=>({...s})) };
  }else if(presetWeekday!=null && !isNaN(presetWeekday)){
    ui.raidForm = { dateMode:'weekday', date:'', weekday:presetWeekday, startTime:'', endTime:'', title:'', note:'', slots:[] };
  }else{
    ui.raidForm = { dateMode:'date', date: todayStr(), weekday:null, startTime:'', endTime:'', title:'', note:'', slots:[] };
  }
  render();
}
function addMemberToLineup(memberId){
  if(!ui.raidForm.slots.some(s=>s.type==='member' && s.refId===memberId)){
    ui.raidForm.slots.push({ type:'member', refId: memberId });
  }
  renderModalOnly();
}
function addGuestFromModal(){
  const input = document.getElementById('guest-name-input');
  const name = input.value.trim();
  if(!name) return;
  ui.raidForm.slots.push({ type:'guest', id:uid(), name });
  input.value='';
  renderModalOnly();
}
function removeSlot(key){
  ui.raidForm.slots = ui.raidForm.slots.filter(s=> slotKey(s)!==key);
  renderModalOnly();
}
function saveRaidFromModal(){
  const dateMode = ui.raidForm.dateMode;
  let date = '', weekday = null;
  if(dateMode==='weekday'){
    const wdVal = document.getElementById('r-weekday').value;
    if(wdVal===''){ alert('請選擇星期'); return; }
    weekday = Number(wdVal);
  }else{
    date = document.getElementById('r-date').value;
    if(!date){ alert('請選擇日期'); return; }
  }
  const startTime = document.getElementById('r-start').value;
  let endTime = document.getElementById('r-end').value;
  const title = document.getElementById('r-title').value.trim();
  const note = document.getElementById('r-note').value.trim();
  if(!startTime){ alert('請輸入開始時間'); return; }
  if(!endTime) endTime = addMinutes(startTime,60);
  const payload = { dateMode, date, weekday, startTime, endTime, title, note, slots: ui.raidForm.slots };
  if(ui.editingRaidId){ const r=state.raids.find(x=>x.id===ui.editingRaidId); Object.assign(r,payload); }
  else state.raids.push({ id:uid(), ...payload });
  saveData(); closeModal();
}
// 複製王團名稱、時間與出場名單到剪貼簿，格式：
// 王團名 週X 時間
// 1.遊戲ID-名字
// 2.遊戲ID-名字
function buildRaidCopyText(r){
  const wd = raidWeekday(r);
  const wdLabel = wd!=null ? '週'+WEEKDAYS[wd] : '';
  const timeLabel = fmtTimeRange(r.startTime, r.endTime);
  const header = [r.title||'王團', wdLabel, timeLabel].filter(Boolean).join(' ');
  const lines = r.slots.map((s,i)=>{
    if(s.type==='member'){
      const m = memberById(s.refId);
      const gameId = m ? m.gameId : '（已刪除的成員）';
      const name = m && m.name ? m.name : '';
      return `${i+1}.${gameId}${name?'-'+name:''}`;
    }
    return `${i+1}.${s.name}`;
  });
  return [header, ...lines].join('\n');
}
function copyRaidInfo(id, btnEl){
  const r = state.raids.find(x=>x.id===id);
  if(!r) return;
  const text = buildRaidCopyText(r);
  const showResult = ok=>{
    if(!btnEl) return;
    const original = btnEl.textContent;
    btnEl.textContent = ok ? '已複製 ✓' : '複製失敗';
    setTimeout(()=>{ btnEl.textContent = original; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showResult(true)).catch(()=>showResult(false));
  }else{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showResult(true);
    }catch(e){ showResult(false); }
  }
}
function confirmDeleteRaid(id){
  const r = state.raids.find(x=>x.id===id);
  ui.modal='confirm';
  ui.confirm = {
    title:'刪除王團紀錄',
    message:`確定要刪除「${esc(r.title||'王團')}」（${fmtRaidDate(r)} ${fmtTimeRange(r.startTime,r.endTime)}）的紀錄嗎？此動作無法復原。`,
    confirmLabel:'刪除',
    onConfirm: ()=>{ state.raids = state.raids.filter(x=>x.id!==id); saveData(); render(); }
  };
  render();
}

// ---------- 行事曆拖拉操作（直接作用於已儲存的王團紀錄） ----------
function addMemberToExistingRaid(raidId, memberId){
  const r = state.raids.find(x=>x.id===raidId);
  if(!r) return;
  if(!r.slots.some(s=>s.type==='member' && s.refId===memberId)){
    r.slots.push({ type:'member', refId: memberId });
    saveData(); renderTabOnly();
  }
}
function removeSlotFromRaid(raidId, key){
  const r = state.raids.find(x=>x.id===raidId);
  if(!r) return;
  r.slots = r.slots.filter(s=> slotKey(s)!==key);
  saveData(); renderTabOnly();
}
function moveSlotBetweenRaids(fromRaidId, toRaidId, key){
  if(!fromRaidId || !toRaidId || fromRaidId===toRaidId) return;
  const fromR = state.raids.find(x=>x.id===fromRaidId);
  const toR = state.raids.find(x=>x.id===toRaidId);
  if(!fromR || !toR) return;
  const slot = fromR.slots.find(s=> slotKey(s)===key);
  if(!slot) return;
  fromR.slots = fromR.slots.filter(s=> slotKey(s)!==key);
  const dup = slot.type==='member' && toR.slots.some(s=>s.type==='member' && s.refId===slot.refId);
  if(!dup) toR.slots.push({ ...slot });
  saveData(); renderTabOnly();
}

function closeModal(){
  ui.modal=null; ui.editingMemberId=null; ui.editingRaidId=null; ui.raidForm=null; ui.confirm=null; ui.poolSearch='';
  render();
}

// ---------- 預設（範例）資料：方便快速體驗時間衝突偵測 ----------
function addSampleData(){
  if(state.members.some(m=>m.isSample)){
    alert('範例資料已經存在，如需重新產生，請先按「清除預設資料」。');
    return;
  }
  const sampleMembers = [
    { id:uid(), gameId:'劍聖阿明', name:'阿明', isSample:true },
    { id:uid(), gameId:'法師小白', name:'小白', isSample:true },
    { id:uid(), gameId:'弓手阿飛', name:'阿飛', isSample:true },
    { id:uid(), gameId:'牧師小雨', name:'小雨', isSample:true },
    { id:uid(), gameId:'盜賊阿凱', name:'阿凱', isSample:true },
  ];
  state.members.push(...sampleMembers);
  const [m1,m2,m3,m4] = sampleMembers;
  state.raids.push(
    { id:uid(), dateMode:'weekday', date:'', weekday:6, startTime:'20:00', endTime:'21:00', title:'海龍王', note:'', isSample:true,
      slots:[ {type:'member', refId:m1.id}, {type:'member', refId:m2.id}, {type:'member', refId:m3.id} ] },
    { id:uid(), dateMode:'weekday', date:'', weekday:6, startTime:'20:30', endTime:'21:30', title:'冰龍王', note:'', isSample:true,
      slots:[ {type:'member', refId:m2.id}, {type:'member', refId:m4.id} ] }
  );
  saveData(); render();
}
function confirmClearSampleData(){
  if(!state.members.some(m=>m.isSample) && !state.raids.some(r=>r.isSample)){
    alert('目前沒有範例資料。');
    return;
  }
  ui.modal='confirm';
  ui.confirm = {
    title:'清除預設資料',
    message:'確定要移除「新增預設資料」建立的範例成員與王團紀錄嗎？不會影響你自己新增的其他資料。',
    confirmLabel:'清除',
    onConfirm: ()=>{
      const sampleMemberIds = new Set(state.members.filter(m=>m.isSample).map(m=>m.id));
      state.members = state.members.filter(m=>!m.isSample);
      state.raids = state.raids.filter(r=>!r.isSample);
      state.raids.forEach(r=>{ r.slots = r.slots.filter(s=> !(s.type==='member' && sampleMemberIds.has(s.refId))); });
      saveData(); render();
    }
  };
  render();
}

// ---------- export / import ----------
function exportJSON(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`guild-raid-schedule-${todayStamp()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ alert('檔案格式錯誤，無法解析 JSON。'); e.target.value=''; return; }
    if(!parsed || !Array.isArray(parsed.members) || !Array.isArray(parsed.raids)){
      alert('檔案內容不符合預期格式（需包含 members 與 raids 陣列）。'); e.target.value=''; return;
    }
    ui.modal='confirm';
    ui.confirm = {
      title:'匯入資料',
      message:`即將匯入 ${parsed.members.length} 位成員、${parsed.raids.length} 筆王團紀錄，並「取代」目前所有資料。建議先匯出目前資料備份。確定要繼續嗎？`,
      confirmLabel:'取代匯入',
      onConfirm: ()=>{ state = { members: parsed.members, raids: parsed.raids }; saveData(); render(); }
    };
    render();
    e.target.value='';
  };
  reader.readAsText(file);
}

// ---------- init ----------
loadData();
